services:
  frontend:
    image: ghcr.io/profiidev/images/node-gnu-dev:main@sha256:ac47b5eca42ff11dbd368385d1403882b358a343a6188258527f6b1ea678a8ba
    restart: unless-stopped
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    volumes:
      - ./frontend:/app/frontend
      - ./node_modules:/app/node_modules
      - ./package-lock.json:/app/package-lock.json
      - ./package.json:/app/package.json
    tty: true
    ports:
      - '5174:5174'
    networks:
      - nginx
    working_dir: /app/frontend
    command: npm run dev -- --host
    #command: npm i

  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:b40f893446b80ba8d5c5ac9c80031b92b4355a21b388fd3b2c30fc1830ecb03e
    user: '${HOST_UID:-0}:${HOST_GID:-0}'
    volumes:
      - ./backend:/app
    networks:
      - nginx
    tty: true
    ports:
      - '5173:8000'
    entrypoint: ['tini', '--']
    command: ['cargo', 'watch', '-x', 'run']
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test
    networks:
      - nginx
    ports:
      - '9301:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'test']
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

networks:
  nginx:
